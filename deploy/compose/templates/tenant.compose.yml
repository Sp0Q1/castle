# A real tenant: the same oauth2-proxy front as a canary, but its upstream is
# this tenant's own castle app, backed by its own Postgres, on an isolated
# per-tenant network. castle + postgres are reachable ONLY by this tenant's
# oauth2-proxy — never by the edge, the IdP, or another tenant.
#
# Promoting a canary to a tenant swaps canary.compose.yml -> this file for the
# same codename: identical oauth2-proxy config except --upstream, plus the
# castle+pg stack. Same subdomain, same pre-issued cert, same realm name.
#
# castlectl substitutes __CODENAME__, __REALM__, __HOST__, __IMAGE__ and secrets.

networks:
  edge:
    name: castle_edge
    external: true
  kc:
    name: castle_kc
    external: true
  # Private to this tenant, and internal: only the containers that join it
  # reach castle and its database, and those two reach nothing outside it.
  # `internal` is what closes it: podman routes between ordinary bridge
  # networks.
  tenant:
    name: castle_tenant___CODENAME__
    internal: true

volumes:
  castle_uploads: {}
  castle_db: {}

services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
    container_name: oauth2-proxy-__CODENAME__
    restart: always
    networks: [edge, kc, tenant]
    depends_on: [castle]
    command:
      - --provider=oidc
      - --client-id=castle
      # A sign-in code is bound to the browser that asked for it, twice over:
      # Keycloak redeems it only for the verifier this proxy kept for that
      # browser (PKCE), and the proxy accepts the identity token only with
      # the nonce it sent along. A code that reaches another browser is of no
      # use there.
      - --code-challenge-method=S256
      - --insecure-oidc-skip-nonce=false
      - --redirect-url=https://__HOSTPORT__/oauth2/callback
      - --upstream=http://castle-__CODENAME__:5150
      - --http-address=0.0.0.0:4180
      - --email-domain=*
      - --reverse-proxy=true
      # Redirect straight to Keycloak instead of showing oauth2-proxy's own
      # sign-in page — so an unauthenticated GET 302s to the realm, exactly
      # like a real tenant. Without this it 403s an interstitial (a tell).
      - --skip-provider-button=true
      # Full single-logout: on /oauth2/sign_out, oauth2-proxy calls Keycloak's
      # end-session endpoint SERVER-SIDE with the real id_token (the {id_token}
      # placeholder), which ends the SSO session with no confirmation page. Uses
      # the in-container Keycloak URL — it's a backchannel call, not a redirect.
      - --backend-logout-url=http://keycloak:8080/realms/__REALM__/protocol/openid-connect/logout?id_token_hint={id_token}
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-csrf-per-request=true
      # The session is renewed with Keycloak just inside the access token's five
      # minutes. A user disabled or signed out there loses the portal at the next
      # renewal, and a changed group reaches castle with it; without this the
      # cookie alone decides, for as long as it lives.
      - --cookie-refresh=4m
      # The realm's longest session (ssoSessionMaxLifespan), not the default week.
      - --cookie-expire=10h
      - --pass-user-headers=true
      - --set-xauthrequest=true
      # Every forwarded request carries the secret this proxy shares with its
      # castle (the password below, in a Basic Authorization header that
      # replaces whatever the browser sent). Castle believes identity headers
      # from nothing else.
      - --pass-basic-auth=true
      - --skip-oidc-discovery=true
      - --oidc-issuer-url=__KC_PUBLIC__/realms/__REALM__
      - --login-url=__KC_PUBLIC__/realms/__REALM__/protocol/openid-connect/auth
      - --redeem-url=http://keycloak:8080/realms/__REALM__/protocol/openid-connect/token
      - --oidc-jwks-url=http://keycloak:8080/realms/__REALM__/protocol/openid-connect/certs
      - --profile-url=http://keycloak:8080/realms/__REALM__/protocol/openid-connect/userinfo
    environment:
      # Injected from the environment by castlectl (see canary template note).
      OAUTH2_PROXY_CLIENT_SECRET: ${OAP_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAP_COOKIE_SECRET}
      OAUTH2_PROXY_BASIC_AUTH_PASSWORD: ${CASTLE_UPSTREAM_SECRET}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  castle:
    image: __IMAGE__
    container_name: castle-__CODENAME__
    restart: always
    # Only on the private tenant network — unreachable except via oauth2-proxy.
    networks: [tenant]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CASTLE_AUTH_MODE: proxy
      # CASTLE_DB_PW is hex (URL-safe); JWT_SECRET is base64 (loco decodes it).
      DATABASE_URL: postgres://castle:${CASTLE_DB_PW}@postgres-__CODENAME__:5432/castle
      JWT_SECRET: ${CASTLE_JWT}
      CASTLE_PROXY_SECRET: ${CASTLE_UPSTREAM_SECRET}
      HOST: https://__HOST__
      # Set by castlectl when branding/logo exists; empty keeps the built-in brand.
      CASTLE_LOGO: ${CASTLE_LOGO}
      # castle's default logout (/oauth2/sign_out?rd=/) is enough: oauth2-proxy
      # ends the Keycloak session via --backend-logout-url above, clears its own
      # cookie, and returns to the app root — which then shows a fresh login.
    volumes:
      - castle_uploads:/app/uploads:z
      - __BRANDING__:/app/branding:ro,z
    healthcheck:
      # Liveness so a boot can be told apart from a crash-loop (up -d returns at
      # container-create, long before loco is serving): /api/auth/mode is a
      # route castle answers without an identity and it 200s with {"mode":...},
      # so a 200 here proves the app is actually up, not just that the port opened.
      # The runtime image is debian-slim — no curl/wget, and its /bin/sh is dash
      # (no /dev/tcp) — and podman-compose flattens an exec-form ["CMD",...] test
      # back through /bin/sh, so invoke bash explicitly to get its /dev/tcp: the
      # same raw-socket HTTP probe keycloak uses. start_period covers the first
      # boot's auto_migrate.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/5150 && echo -e \"GET /api/auth/mode HTTP/1.0\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: postgres-__CODENAME__
    restart: always
    networks: [tenant]
    # Run as the postgres user (uid 70) so the entrypoint skips gosu — gosu spins
    # under no-new-privileges (see keycloak-db in platform.compose.yml). `:U`
    # chowns the volume so uid 70 can write it.
    user: "70:70"
    environment:
      POSTGRES_DB: castle
      POSTGRES_USER: castle
      POSTGRES_PASSWORD: ${CASTLE_DB_PW}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - castle_db:/var/lib/postgresql/data:U
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "castle", "-d", "castle"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    # Starting as uid 70 skips the entrypoint's root->postgres gosu drop, and `:U`
    # pre-chowns the volume, so Postgres needs no capabilities — drop them all like
    # every other service. (Verified: a fresh initdb and normal operation both come
    # up clean under cap_drop:[ALL] + no-new-privileges.)
    cap_drop: [ALL]
