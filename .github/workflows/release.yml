name: Release image

# Builds and PUBLISHES the castle image — the piece that makes a real kubectl
# deploy possible. security.yml builds the same image with `load: true` to scan
# it and never pushes; this one pushes and attaches provenance + an SBOM.
#
# Triggers:
#   push to main   -> ghcr.io/<owner>/castle:main and :sha-<short>
#   tag v*         -> :<version> and :latest   (the refs a real deploy pins to)
#
# Each build carries SLSA provenance + an SBOM attestation (embedded by buildx)
# and is addressable by an immutable digest. Cosign image signing was removed:
# ghcr's OCI 1.1 referrers API is non-functional, so cosign signatures pushed
# there can't be verified (`cosign verify` -> "no signatures found"). Reinstate
# it only alongside a registry that fully supports referrers.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # ghcr requires a lowercase path; github.repository is <owner>/<repo>.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Build, push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr (and OCI references generally) must be lowercase, but github.repository
      # keeps the owner's original casing. metadata-action and build-push-action
      # lowercase it themselves; sbom-action does not, so give every step one
      # already-lowercased ref to use.
      - name: Normalize image ref
        id: image
        run: echo "ref=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      # Derives the tag set from the trigger: branch -> :main, tag -> :<version>
      # + :latest, plus an immutable :sha-<short> on every build so a deploy can
      # pin to an exact commit rather than a moving tag.
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse the dependency layer cache the scan job populates, so a publish
          # is a fast source-only rebuild rather than a full dependency compile.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # provenance + sbom become attestations embedded in the image index.
          provenance: true
          sbom: true

      # A human-readable SBOM as a build artifact too, so it can be diffed and
      # reviewed without pulling attestations out of the registry.
      - name: Generate SBOM artifact
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.image.outputs.ref }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: castle-sbom.spdx.json

      - name: Report what was published
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
            echo "Provenance + SBOM attested. Pin deploys to the digest above."
          } >> "$GITHUB_STEP_SUMMARY"

  # The optimized Keycloak image (deploy/k8s/keycloak/Dockerfile). Built the same
  # way as the app image so keycloak-prod.yaml can pin an immutable digest from
  # our own registry — no boot-time build, read-only rootfs.
  publish-keycloak:
    name: Build, push (keycloak)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr requires lowercase; see the note in the app job above.
      - name: Normalize image ref
        id: image
        run: echo "ref=${IMAGE,,}-keycloak" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: deploy/k8s/keycloak
          file: deploy/k8s/keycloak/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,mode=max,scope=keycloak
          provenance: true
          sbom: true

      - name: Report what was published
        run: |
          {
            echo "### Published (keycloak)"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
            echo "Provenance + SBOM attested. Pin keycloak-prod.yaml to the digest above."
          } >> "$GITHUB_STEP_SUMMARY"
