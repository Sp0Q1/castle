version: 2

# Updates are grouped so a week of patch bumps arrives as one reviewable PR
# rather than twenty. Security updates are deliberately left ungrouped by
# GitHub, so they still land immediately and on their own.
#
# Every ecosystem sets a `cooldown`: the most common supply-chain attack on a
# dependency is a *freshly published* malicious version of a legitimate package,
# and it is usually yanked within days. Waiting a week before proposing a bump
# costs nothing here and removes that window. Cooldown does not apply to
# security updates, so a real CVE fix still arrives immediately.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      rust-minor-patch:
        update-types: [minor, patch]
    ignore:
      # These majors are loco-rs's to choose, not ours: loco re-exports each crate's
      # traits, so a version mismatch stops our types satisfying loco's bounds.
      #
      # sea-orm: loco-rs 1.1 is built against sea-orm 2.x (we upgraded both together,
      # loco 0.16->1.1 / sea-orm 1.1->2.0). Taking a sea-orm *3* early would again put
      # two incompatible copies in the tree and break "the trait bound
      # users::ActiveModel: ActiveModelBehavior". Minor/patch still come through.
      # REMOVE the major hold when loco ships against the next sea-orm major.
      - dependency-name: sea-orm
        update-types: ["version-update:semver-major"]
      - dependency-name: sea-orm-migration
        update-types: ["version-update:semver-major"]
      # validator: loco-rs 1.1 re-exports Validate from validator 0.20; our
      # #[derive(Validate)] + Validatable impl must match. Bumping to 0.21 fails to
      # compile ("the trait bound Validator: loco_rs::prelude::Validate is not
      # satisfied") — verified 2026-08-31. 0.x minor is the breaking axis, so hold
      # minor+major; 0.20.x patches still come through. REMOVE together with the loco
      # bump when loco-rs ships against validator 0.21.
      - dependency-name: validator
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  # Actions are the supply chain of the pipeline itself: a compromised action
  # runs with the workflow's token, which is why every `uses:` is pinned to a
  # full commit SHA. Dependabot understands SHA pins and rewrites both the SHA
  # and its trailing version comment — pinning does not mean going stale.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [major, minor, patch]

  # Container base images live in the root Dockerfile, the optimized-Keycloak
  # Dockerfile, and the compose files + k8s manifests under deploy/. Watching only
  # "/" missed every image outside the root Dockerfile — including Keycloak, which
  # is exactly how it drifted seven minors behind. Watch the whole tree.
  - package-ecosystem: docker
    directories:
      - "/"
      - "/deploy/**"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        update-types: [major, minor, patch]
    # NOTE: Postgres majors are NOT ignored — we want to *see* them. But a pg major
    # changes the on-disk format (a new major won't boot on the old data dir), so
    # its PR is a "plan the migration" signal, not a blind-merge: do the deliberate
    # dump/restore in docs/backup-and-upgrade.md, then bump the pins. The compose
    # file carries the same warning next to the image.
