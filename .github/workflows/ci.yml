name: CI

# Correctness and style gates. Anything that can fail a build or ship a
# regression belongs here; anything that looks for vulnerabilities or secrets
# lives in security.yml so the two can be read (and required) separately.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI is not a place to spend time on incremental artifacts that are thrown away.
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    # Real Postgres for the test suite (see the Test step). SQLite — the config
    # default — is loosely typed and accepts INT4/INT8 interchangeably, which is
    # how a BIGINT-vs-i32 entity mismatch passed CI yet 500'd on the first live
    # tenant (PR #65). Testing on the engine we deploy on catches that class here.
    # Pin to the same major the deployment runs: the compose pins use postgres:18 —
    # keep this in lockstep with those pins.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: castle
          POSTGRES_PASSWORD: castle
          POSTGRES_DB: castle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U castle -d castle_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Dependabot's docker ecosystem does not parse a workflow `services:` block,
      # so the Postgres pin above can silently drift from the deployment's — and a
      # pg-major migration that lands in the compose pins only would leave CI testing the
      # OLD major, defeating the "test on the engine we deploy" guarantee. Compare
      # the CI service major against the compose pin and fail loudly if they diverge.
      - name: Guard Postgres major against the deployment pin
        run: |
          set -euo pipefail
          pg_major() {
            grep -iE '^[[:space:]]*image:.*postgres:[0-9]+' "$1" \
              | head -n1 | grep -oiE 'postgres:[0-9]+' | grep -oE '[0-9]+'
          }
          ci_major=$(pg_major .github/workflows/ci.yml || true)
          deploy_major=$(pg_major deploy/compose/platform.compose.yml || true)
          echo "CI service Postgres major:           ${ci_major:-<none>}"
          echo "Deployment (compose) Postgres major: ${deploy_major:-<none>}"
          if [ -z "$ci_major" ] || [ -z "$deploy_major" ]; then
            echo "::error::could not read a Postgres major from ci.yml or deploy/compose/platform.compose.yml"
            exit 1
          fi
          if [ "$ci_major" != "$deploy_major" ]; then
            echo "::error::CI Postgres major ($ci_major) != deployment pin ($deploy_major) in deploy/compose/platform.compose.yml — bump the postgres service in this file (or the compose pin) so CI tests the major we deploy."
            exit 1
          fi
          echo "OK: CI and deployment agree on Postgres major $ci_major."

      # oauth2-proxy must let nothing past it without a session. An exempted path
      # is how an unauthenticated request reaches castle at all, and it answers
      # differently on a tenant than on a canary, which tells the two apart.
      - name: Guard the proxy against exemptions
        run: |
          if grep -rnE -- '--(skip-auth|skip-jwt-bearer-tokens|trusted-ip)' deploy/compose/templates; then
            echo "::error::the oauth2-proxy flag above lets requests through without a session"
            exit 1
          fi
          # A sign-in code is bound to the browser that asked for it, on a tenant
          # and on a canary alike.
          for flag in '--code-challenge-method=S256' '--insecure-oidc-skip-nonce=false'; do
            for template in deploy/compose/templates/{tenant,canary}.compose.yml; do
              grep -qF -- "- $flag" "$template" \
                || { echo "::error file=$template::the proxy runs without $flag"; exit 1; }
            done
          done

      # fmt, clippy and the tests run on the Rust the image is built with, not
      # on a floating stable: the version is read from the Dockerfile's builder
      # stage, so the two cannot differ, and a pull request that moves it there
      # is checked with it here.
      - name: Read the Rust version from the Dockerfile
        id: rust
        run: |
          version="$(sed -nE 's/^FROM rust:([0-9]+\.[0-9]+(\.[0-9]+)?)-.* AS backend$/\1/p' Dockerfile)"
          if [ -z "$version" ]; then
            echo "::error file=Dockerfile::no Rust version in the builder stage's FROM line"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2

      - name: Format
        run: cargo fmt --all --check

      # -D warnings is the point of the job: the tree is at zero warnings and
      # zero `#[allow]`s outside the loco-generated entities, and should stay
      # there. If a lint is genuinely wrong, waive it with a comment saying why.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        env:
          # Prod parity: exercise the suite against Postgres, not the SQLite default
          # in config/test.yaml, so Postgres-only type mismatches fail here instead
          # of on a promote. The suite's auto_migrate + dangerously_recreate build
          # the schema on this DB. Local `cargo test` still defaults to SQLite.
          DATABASE_URL: postgres://castle:castle@localhost:5432/castle_test
        run: cargo test --all-features

  frontend:
    name: Frontend (biome, tsc, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # `biome ci` is the non-interactive form: it never writes fixes, it fails.
      - name: Lint and format
        run: npx biome ci src/

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Catches the classic mistakes in these files themselves: bad `runs-on`,
      # untrusted `${{ github.event.* }}` interpolation into `run:`, typo'd
      # contexts.
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true
