# Loco configuration file documentation

# Application logging configuration
logger:
  enable: true
  pretty_backtrace: false
  # Log level, options: trace, debug, info, warn or error.
  level: info
  # Structured JSON logs are easier to ship in production.
  format: json

# Web server configuration
server:
  port: <%= get_env(name="PORT", default="5150") %>
  # Bind to all interfaces so the service is reachable inside a container.
  binding: 0.0.0.0
  # The portal's public origin, exactly as a browser names it. Mails link to
  # it, and in proxy mode the `Origin` of a request that changes something is
  # compared with it when the browser sends no `Sec-Fetch-Site`.
  host: <%= get_env(name="HOST", default="http://localhost") %>
  # No `X-Powered-By`: a response does not say what it was built with.
  ident: ""
  middlewares:
    # Loco applies a 2MB body limit by default even with no config, which would
    # reject image uploads well below the 10 MiB cap in `controllers::uploads`.
    # Raised just above that cap so uploads.rs stays the single source of truth
    # for image size. JSON endpoints are NOT protected by this number — their
    # real bound is the per-field limits in `crate::validation`.
    limit_payload:
      body_limit: 12mb
    # Security headers. Without this block loco defaults to enable:false, leaving
    # the SPA and all user-generated content with no CSP/nosniff/frame policy.
    #
    # The policy denies everything and then names what the portal uses: its own
    # scripts, styles, fonts and API, and images from itself or from the object
    # URLs it makes of uploads. No inline script and no inline handler runs.
    # Inline STYLES are allowed for one reason: mermaid writes them into the
    # diagrams it draws. Nothing else in the portal needs them.
    # NOTE: verify diagrams/editor still render after changing this.
    secure_headers:
      enable: true
      preset: github
      overrides:
        Content-Security-Policy: "default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
        X-Content-Type-Options: "nosniff"
        X-Frame-Options: "DENY"
        Referrer-Policy: "no-referrer"
        # The portal uses none of these, so no page and nothing injected into one may.
        Permissions-Policy: "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
        # Its windows and responses are its own: no other site gets a handle on
        # them or may embed them.
        Cross-Origin-Opener-Policy: "same-origin"
        Cross-Origin-Resource-Policy: "same-origin"
        # Nothing is reused without asking the server first. In proxy mode that
        # question goes through oauth2-proxy, so a signed-out browser is sent to
        # sign in rather than shown the app shell from its cache.
        Cache-Control: "no-cache"
    # Serve the built React SPA (run `npm --prefix frontend run build` first).
    # API routes under /api take precedence; the fallback serves index.html so
    # client-side routes like /projects/1 resolve to the SPA.
    static:
      enable: true
      must_exist: true
      precompressed: false
      folder:
        uri: "/"
        path: "frontend/dist"
      fallback: "frontend/dist/index.html"

# Worker Configuration
workers:
  mode: BackgroundAsync

# Mailer Configuration.
mailer:
  smtp:
    enable: true
    host: <%= get_env(name="MAILER_HOST", default="localhost") %>
    port: <%= get_env(name="MAILER_PORT", default="1025") %>
    secure: <%= get_env(name="MAILER_SECURE", default="false") %>

# Database Configuration
database:
  # NO DEFAULT ON PURPOSE, like JWT_SECRET below. With one, an instance started
  # without DATABASE_URL would come up looking healthy on a database nobody
  # provisioned, backs up or can find. With none, the config fails to render and
  # the app refuses to start. Every deployed instance runs on Postgres; SQLite is
  # for development and the test suite only.
  uri: <%= get_env(name="DATABASE_URL") %>
  enable_logging: false
  # Milliseconds. 500ms is fine for local sqlite but too tight for a networked
  # Postgres first-connect (pool times out -> crashloop); use realistic values.
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="5000") %>
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="30000") %>
  min_connections: <%= get_env(name="DB_MIN_CONNECTIONS", default="1") %>
  max_connections: <%= get_env(name="DB_MAX_CONNECTIONS", default="10") %>
  # Run pending migrations on boot.
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

# Authentication Configuration
auth:
  # JWT authentication
  jwt:
    # loco base64-decodes this secret, so JWT_SECRET must be a valid base64
    # string — generate one with `openssl rand -base64 48`.
    # NO DEFAULT ON PURPOSE: a committed placeholder would become a live signing
    # key for anyone who forgets to set it (forgeable tokens for any user). With
    # no default the config fails to render and the app refuses to start.
    secret: <%= get_env(name="JWT_SECRET") %>
    # Token expiration time in seconds
    expiration: 604800 # 7 days

# App-specific settings (parsed by src/security.rs).
settings:
  # "proxy" = run behind oauth2-proxy + Keycloak (this app trusts the proxy's
  # identity headers and manages no passwords). "jwt" = built-in login/register.
  # Env-overridable so one image can run either mode.
  auth_mode: <%= get_env(name="CASTLE_AUTH_MODE", default="proxy") %>
  # An image file that replaces the built-in brand in the header. Empty: none.
  logo: <%= get_env(name="CASTLE_LOGO", default="") %>
  proxy:
    # Identity headers injected by oauth2-proxy. Full reverse-proxy mode sets the
    # x-forwarded-* variants; an nginx auth_request setup with
    # --set-xauthrequest sets x-auth-request-* instead.
    # The identity provider's own id for the person, which an account is bound
    # to: Keycloak's `sub`, sent by oauth2-proxy as x-forwarded-user.
    subject_header: x-forwarded-user
    email_header: x-forwarded-email
    name_header: x-forwarded-preferred-username
    groups_header: x-forwarded-groups
    # The secret this instance shares with its own proxy, which sends it as the
    # password of a Basic `Authorization` header (oauth2-proxy: --pass-basic-auth
    # and OAUTH2_PROXY_BASIC_AUTH_PASSWORD). Identity headers are read only from
    # a request that carries it, and proxy mode does not start without it. A
    # literal block, so the value is read character for character.
    secret: |2-
      <%= get_env(name="CASTLE_PROXY_SECRET", default="") %>
    # The Keycloak group that gives each role, by its exact name. Someone in
    # none of the three has no role and is refused.
    manager_group: castle-managers
    staff_group: castle-staff
    client_group: castle-clients
    # Where sign-out sends the browser. The default signs out at oauth2-proxy,
    # which ends the Keycloak session too when it runs with
    # --backend-logout-url, as the Compose templates do. To go through the
    # IdP's own end-session page instead, chain to it:
    #   /oauth2/sign_out?rd=<url-encoded {issuer}/protocol/openid-connect/logout
    #     ?post_logout_redirect_uri=<app-url>&client_id=castle>
    # with that post_logout_redirect_uri on the Keycloak client (the realm
    # script sets it) and the IdP host in oauth2-proxy's --whitelist-domain.
    logout_url: <%= get_env(name="CASTLE_LOGOUT_URL", default="/oauth2/sign_out?rd=/") %>
